name: Validate platform knowledge
on:
  pull_request:
    paths:
      - "knowledge/**"
      - ".github/agents/**"
      - ".github/skills/**"
      - ".github/workflows/validate-knowledge.yml"
  push:
    branches: [develop]
    paths:
      - "knowledge/**"
      - ".github/agents/**"
      - ".github/skills/**"
jobs:
  validate-analytics-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML
      - name: Validate approved Analytics Foundation knowledge
        run: |
          python .github/skills/validate-knowledge-release/scripts/validate_knowledge.py \
            --platform knowledge/platforms/analytics-foundation
