  result: passed
  checks:
  - all SQL parsed offline
  - dump object inventory matches outputs
  - JSONL serialization round-trip
  - unique IDs
  - record references
  - foreign key targets/columns
  - ALTER constraints and identity sequences
  - source line bounds/hash
  - administrative restrictions
  - unchanged prior records, approval and sources
  - five parser fixture tests (quoted names, composite keys, identity/ownership, defaults,
    indexes, comments, UNION/join lineage, dollar-quoted routines, unsupported statements)
  - all 89 view projections resolved to source column IDs including every UNION operand
  limitations:
  - No repository-wide validator or record JSON Schemas are supplied.
  - View expression types are null when not determinable by direct source/cast or
    identical UNION operand types; view nullability is not inferred.
  - PL/pgSQL bodies are preserved as opaque untrusted SQL; not executed or compiled.
  - Unique/check constraints and trigger definitions are embedded in table records
    because no separate output files are configured.
  - Declared metadata is not a domain mapping verification or runtime authorization.
