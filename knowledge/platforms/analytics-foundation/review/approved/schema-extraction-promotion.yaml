  mutation: Copied reviewed drafts; only status=approved and approvalRef added. IDs,
    facts, sourceRefs and runtime restrictions preserved.
  draftsRetained: true
  conditions:
  - id: unknown-computed-types
    description: 'Retain explicitly unknown types for exposure_process_job.rework_context,
      lis_job.application_id and lis_job.request_type. Resolve the actual types before
      typed runtime use; do not guess them. These are three accepted parser limitations,
      not resolved type determinations.

      '
  - id: restricted-runtime-objects
    description: 'Retain all 148 restricted objects as physical knowledge while excluding
      them from runtime access. Preserve function, sequence and administrative object
      restrictions and runtimeAuthorized=false on every record.

      '
  - id: release-validation
    description: 'Repository-level record schemas and deterministic knowledge validation
      remain required before the first immutable platform release. Local structural
      checks do not certify runtime readiness.

      '
  - id: physical-stage-configuration
    description: 'Correct the misplaced physicalSchema input/output/approval configuration
      before relying on stage-specific approval or promotion automation. This approval
      uses the explicitly configured schema-extraction filenames and does not silently
      repair or waive the configuration issue.

      '
  - id: physical-only-approval
    description: 'Approval covers only the checksum-bound physical-schema snapshot.
      It does not verify documented domain mappings or authorize business meaning,
      query capabilities, SQL execution or runtime exposure. Changes to the approved
      snapshot require a new review and approval.

      '
  runtimeAuthorization:
    physicalSchema: false
    restrictedObjects: false
    semanticMappings: false
    reason: 'Human physical-schema approval permits a separate promotion into the
      approved schema layer, subject to the retained conditions. It does not itself
      promote records or authorize runtime use. Runtime authorization requires the
      applicable subsequent approvals and an immutable release.

      '
  releaseCreated: false
  configurationHandling: One-off snapshot-bound promotion using explicit human approval
    and matching draft/approved schema paths. Does not rely on malformed stage input/output/approval
    discovery. Configuration repair remains required before stage automation.
  validation:
