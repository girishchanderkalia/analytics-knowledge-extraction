apiVersion: knowledge.analytics-foundation/v1
kind: PlatformKnowledgeConfiguration

metadata:
  id: analytics-foundation
  name: Analytics Foundation

spec:
  root: knowledge/platforms/analytics-foundation

  sources:
    domain:
      - id: lana-context-model
        path: sources/domain/Lana-ContextModel.pdf
        type: pdf
        authority: domain-model

    schema:
      - id: lanadb-schema
        path: sources/schema/lanadb-schema.sql
        type: postgresql-schema
        authority: deployed-schema

  database:
    system: postgresql
    datasource: lanadb

    allowedSchemas:
      - lisa

  knowledge:
    draftRoot: knowledge/draft
    approvedRoot: knowledge/approved
    releasesRoot: knowledge/releases

    domain:
      draftPath: knowledge/draft/domain
      approvedPath: knowledge/approved/domain

      outputs:
        concepts: concepts.jsonl
        attributes: attributes.jsonl
        relationships: relationships.jsonl
        identifiers: identifiers.jsonl
        enumerations: enumerations.jsonl
        rules: rules.jsonl
        documentedMappings: documented-mappings.jsonl
        unresolved: unresolved.jsonl

    schema:
      draftPath: knowledge/draft/schema
      approvedPath: knowledge/approved/schema

      outputs:
        schemas: schemas.jsonl
        tables: tables.jsonl
        views: views.jsonl
        columns: columns.jsonl
        primaryKeys: primary-keys.jsonl
        foreignKeys: foreign-keys.jsonl
        indexes: indexes.jsonl
        comments: comments.jsonl
        functions: functions.jsonl
        sequences: sequences.jsonl
        viewLineage: view-lineage.jsonl
        restrictedObjects: restricted-objects.jsonl
        parseErrors: parse-errors.jsonl

    mappings:
      draftPath: knowledge/draft/mappings
      approvedPath: knowledge/approved/mappings

      outputs:
        entityObjects: entity-object-mappings.jsonl
        attributeColumns: attribute-column-mappings.jsonl
        identifiers: identifier-mappings.jsonl
        relationships: relationship-join-mappings.jsonl
        canonicalPaths: canonical-path-mappings.jsonl
        storageBoundaries: storage-boundaries.jsonl
        unresolved: unresolved-mappings.jsonl

  extraction:
    domain:
      agent: document-knowledge-extractor
      skill: extract-pdf-domain-knowledge

      requiredFields:
        - id
        - platformId
        - status
        - sourceRefs

      identifierCategories:
        - canonical
        - associating
        - internal-database
        - composite

      evidencePolicy:
        documentDatabaseMappings: documented
        schemaVerificationRequired: true

      preserve:
        - definitions
        - attributes
        - inheritance
        - abstract-final-status
        - relationships
        - cardinality
        - enumerations
        - deprecations
        - unresolved-issues

    schema:
      agent: database-schema-extractor
      skill: parse-postgresql-schema

      executeSourceSql: false
      preserveQualifiedNames: true
      resolveAlterTableConstraints: true
      restrictAdministrativeObjects: true

    mappings:
      agent: semantic-mapping-builder
      skill: map-domain-to-schema

      evidenceStates:
        - documented
        - declared
        - implemented
        - verified
        - inferred
        - unresolved

      verifiedRequires:
        - approved-domain-evidence
        - physical-schema-evidence

  review:
    pendingPath: review/pending
    approvedPath: review/approved
    rejectedPath: review/rejected
    policyDirectory: review/config

    stages:
      domain:
        reviewFile: domain-review.md
        changeSetFile: domain-change-set.yaml
        findingsFile: domain-review-findings.md
        approvalFile: domain-approval.yaml
        stopForHumanApproval: true
        
        policy: review/config/domain-review-policy.yaml
        draftPath: knowledge/draft/domain
        pendingPath: review/pending

        inputs:
          review: domain-review.md
          findings: domain-review-findings.md
          changeSet: domain-change-set.yaml
          resolutions: domain-review-resolutions.yaml

        outputs:
          review: domain-review.md
          findings: domain-review-findings.md
          changeSet: domain-change-set.yaml
          resolutionReport: domain-resolution-report.md

        approval:
          required: true
          approvalFile: review/approved/domain-approval.yaml

      schemaMappings:
        reviewFile: schema-mapping-review.md
        changeSetFile: schema-mapping-change-set.yaml
        findingsFile: schema-mapping-review-findings.md
        approvalFile: schema-mapping-approval.yaml
        stopForHumanApproval: true

        policy: review/config/schema-mapping-review-policy.yaml
        draftPath: knowledge/draft/mappings
        pendingPath: review/pending

        approval:
          required: true
          approvalFile: review/approved/schema-mapping-approval.yaml

  release:
    immutable: true
    requireAllApprovals: true
    includeSourceHashes: true
    includeChecksums: true
    includeSemanticDiff: true